# Every check both services and the accuracy harness must pass, on every pull
# request, plus the per-commit isolation check that the repository's history
# depends on. Images are published only from main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  GOLANGCI_VERSION: "v2.13.2"
  PYTHON_VERSION: "3.12"

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: build
        working-directory: agent
        run: go build ./...
      - name: vet
        working-directory: agent
        run: go vet ./...
      # -race, because the agent runs an informer that delivers from more
      # than one goroutine into a shared emitter and a shared seen-set.
      - name: test
        working-directory: agent
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: agent

  brain:
    name: brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: brain/uv.lock
      - name: sync
        working-directory: brain
        run: uv sync --frozen --group dev
      - name: lint
        working-directory: brain
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .
      - name: typecheck
        working-directory: brain
        run: uv run --group dev mypy
      - name: test
        working-directory: brain
        run: uv run --group dev pytest -q

  harness:
    name: accuracy harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: brain/uv.lock
      - name: sync
        working-directory: brain
        run: uv sync --frozen --group dev
      # The harness scores the ledger against the catalogue. Its own logic is
      # checked here; a run needs a cluster and a model key and is not CI's job.
      - name: check
        working-directory: brain
        run: |
          uv run --group dev ruff check ../eval
          uv run --group dev ruff format --check ../eval
          uv run --group dev mypy ../eval
          uv run --group dev pytest -q ../eval

  isolation:
    name: every commit builds on its own
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: brain/uv.lock
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      # Section 6.8: a commit that only builds because of a later one makes
      # bisect useless and makes the history a lie.
      - name: verify each commit
        run: ./scripts/verify-commits.sh origin/${{ github.base_ref }}

  images:
    name: publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [agent, brain, harness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: coroner-agent
            context: agent
          - name: coroner-brain
            context: brain
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest
      # Nobody who wants to try Coroner should have to build anything, so
      # both architectures are published. Section 7.2.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
