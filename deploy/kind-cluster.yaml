# Coroner local cluster.
#
# One control plane + two workers, so that eviction, rescheduling, and
# node-pressure behaviour are actually observable -- a single-node cluster
# cannot produce the signals coroner-agent is built to collect.
#
# The node image is pinned by digest, not just tag, so this file reproduces
# byte-identical nodes on any machine and cannot drift when upstream retags.
# Digest corresponds to kind v0.33.0's default image, Kubernetes v1.37.0.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: coroner
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
