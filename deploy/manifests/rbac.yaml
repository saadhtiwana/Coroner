# Cluster access for coroner-agent.
#
# Read-only by design. The agent is the only component holding credentials, but
# it holds no write permissions until an approval-gated execution path exists.
# Write verbs are added in the phase that implements execution, not before, so
# that an unapproved mutation is impossible rather than merely disallowed by
# convention. See docs/DESIGN.md section 1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coroner-agent
  namespace: coroner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coroner-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coroner-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coroner-agent-read
subjects:
  - kind: ServiceAccount
    name: coroner-agent
    namespace: coroner
