# Recreates the recorded OOMKilledDuringInit incident: a limit so low that the
# container runtime's init is killed before any application code runs. Reports
# StartError with exit code 128, not OOMKilled with 137, and surfaces as
# CrashLoopBackOff. docs/DESIGN.md sections 2.2 and 6.2.
apiVersion: v1
kind: Pod
metadata:
  name: probe-oom-init
  namespace: default
  labels:
    coroner.dev/purpose: probe
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: tiny
      image: redis:alpine
      imagePullPolicy: Never
      resources:
        requests:
          memory: 2Mi
        limits:
          memory: 2Mi
      command: ["/bin/sh", "-c", "echo alive; sleep 3600"]
